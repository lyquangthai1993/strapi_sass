services:
  - type: web
    name: strapi-app
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: USERS_PERMISSIONS_JWT_SECRET
        value: qQdELFXPlmGRNXZwzCTow1KxHaREs65WBICzDmUjBp0=
